name: Unit tests

# Unit and component tests only (no Firebase, no secrets, no deployment).
on:
  push:
    branches: ['story-spark-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
