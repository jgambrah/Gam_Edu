name: Security rules tests

# Runs the Firebase Storage + Firestore rules tests against the local emulators, plus the unit tests.
# No secrets are used and nothing is deployed: it talks only to emulators with a "demo-" project id.
on:
  push:
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'src/firestore.rules'
      - 'tests/rules/**'
      - 'firebase.emulators.json'
      - 'vitest*.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-tests.yml'
  pull_request:
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'tests/rules/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Unit and component tests
        run: npm test
      - name: Security rules tests (Firebase emulators)
        run: npm run test:rules
      - name: The two firestore.rules copies must be identical
        run: diff -q firestore.rules src/firestore.rules
